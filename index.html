<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Carousel Studio Pro - Marijana AI Digital Soul</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- JSZip for batch download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ivory: '#FAF8F5',
                        'sage-green': '#879A83',
                        'sage-dark': '#5F715C',
                        'gold-light': '#D4AF37',
                        'gold-dark': '#AA7C11',
                        'dark-luxury': '#1A1816',
                        'violet-main': '#6B46C1',
                        'violet-light': '#9F7AEA'
                    }
                }
            }
        }
    </script>
    <style>
        .carousel-preview {
            width: 1080px;
            height: 1350px;
            transform-origin: top left;
        }
    </style>
</head>
<body class="bg-stone-900 text-stone-100 font-['DM_Sans',sans-serif] min-h-screen flex flex-col">

    <!-- Top Navigation -->
    <header class="bg-stone-950 border-b border-stone-800 px-6 py-4 flex flex-wrap justify-between items-center gap-4 sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-gold-dark via-sage-green to-violet-main flex items-center justify-center text-white font-bold text-lg shadow-lg">M</div>
            <div>
                <h1 class="font-bold text-lg text-stone-100 tracking-wide">Bulk Carousel Studio Pro</h1>
                <p class="text-xs text-sage-green font-medium">Marijana AI Digital Soul</p>
            </div>
        </div>
        <div class="flex flex-wrap items-center gap-3">
            <button onclick="openBulkModal()" class="bg-stone-800 hover:bg-stone-700 text-stone-200 px-4 py-2 rounded-xl text-sm font-medium transition flex items-center gap-2 border border-stone-700">
                <span>📝 Bulk Unos Teksta</span>
            </button>
            <button onclick="addNewCarousel()" class="bg-sage-green hover:bg-sage-dark text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-md flex items-center gap-2">
                <span>➕ Dodaj Novi Karusel</span>
            </button>
            <button onclick="downloadAllZips()" class="bg-gradient-to-r from-gold-dark to-amber-600 hover:from-amber-600 hover:to-gold-dark text-stone-950 font-bold px-5 py-2 rounded-xl text-sm transition shadow-lg flex items-center gap-2">
                <span>📥 Preuzmi Sve (ZIP)</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Sidebar Controls -->
        <aside class="lg:col-span-5 space-y-6 bg-stone-950 p-6 rounded-2xl border border-stone-800 shadow-xl overflow-y-auto max-h-[calc(100vh-140px)]">
            
            <!-- Global Theme & Color Customizer -->
            <div class="space-y-4">
                <h2 class="text-md font-semibold text-gold-light border-b border-stone-800 pb-2 flex justify-between items-center">
                    <span>🎨 Dizajn i Palete Boja</span>
                    <button onclick="invertColors()" class="text-xs bg-stone-800 hover:bg-stone-700 text-stone-300 px-2.5 py-1 rounded-lg border border-stone-700">Invertuj</button>
                </h2>
                
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-xs text-stone-400 block mb-1">Tema / Paleta</label>
                        <select id="themeSelect" onchange="changeTheme(this.value)" class="w-full bg-stone-900 border border-stone-700 rounded-xl p-2.5 text-sm text-stone-200 focus:border-sage-green outline-none">
                            <option value="ivory">Ivory & Sage (Brend)</option>
                            <option value="sage-gold">Sage & Gold Editorial</option>
                            <option value="violet">Deep Violet Luxury</option>
                            <option value="green-gradient">Zeleni Gradijent</option>
                            <option value="dark">Dark Espresso</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-stone-400 block mb-1">Font Naslova</label>
                        <select id="fontTitleSelect" onchange="updateGlobalStyles()" class="w-full bg-stone-900 border border-stone-700 rounded-xl p-2.5 text-sm text-stone-200 focus:border-sage-green outline-none">
                            <option value="'Playfair Display', serif">Playfair Display</option>
                            <option value="'Cormorant Garamond', serif">Cormorant Garamond</option>
                            <option value="'Montserrat', sans-serif">Montserrat</option>
                            <option value="'Poppins', sans-serif">Poppins</option>
                            <option value="'Lora', serif">Lora</option>
                        </select>
                    </div>
                </div>

                <!-- Custom Color Studio Grid -->
                <div class="bg-stone-900/80 p-3.5 rounded-xl border border-stone-800 space-y-3">
                    <p class="text-xs font-semibold text-stone-300">Slobodan izbor boja:</p>
                    <div class="grid grid-cols-3 gap-2 text-xs">
                        <div>
                            <span class="text-stone-400 block mb-1">Pozadina 1</span>
                            <div class="flex items-center gap-2">
                                <input type="color" id="customBg1" value="#FAF8F5" onchange="updateCustomColors()" class="w-8 h-8 rounded bg-transparent cursor-pointer">
                                <input type="text" id="customBg1Hex" value="#FAF8F5" onchange="syncColorInput('customBg1', this.value)" class="w-16 bg-stone-800 border border-stone-700 rounded px-1 text-[11px] text-stone-200">
                            </div>
                        </div>
                        <div>
                            <span class="text-stone-400 block mb-1">Pozadina 2</span>
                            <div class="flex items-center gap-2">
                                <input type="color" id="customBg2" value="#F0ECE1" onchange="updateCustomColors()" class="w-8 h-8 rounded bg-transparent cursor-pointer">
                                <input type="text" id="customBg2Hex" value="#F0ECE1" onchange="syncColorInput('customBg2', this.value)" class="w-16 bg-stone-800 border border-stone-700 rounded px-1 text-[11px] text-stone-200">
                            </div>
                        </div>
                        <div>
                            <span class="text-stone-400 block mb-1">Boja Teksta</span>
                            <div class="flex items-center gap-2">
                                <input type="color" id="customText" value="#1A1816" onchange="updateCustomColors()" class="w-8 h-8 rounded bg-transparent cursor-pointer">
                                <input type="text" id="customTextHex" value="#1A1816" onchange="syncColorInput('customText', this.value)" class="w-16 bg-stone-800 border border-stone-700 rounded px-1 text-[11px] text-stone-200">
                            </div>
                        </div>
                        <div>
                            <span class="text-stone-400 block mb-1">Naslovi</span>
                            <div class="flex items-center gap-2">
                                <input type="color" id="customHeading" value="#1A1816" onchange="updateCustomColors()" class="w-8 h-8 rounded bg-transparent cursor-pointer">
                                <input type="text" id="customHeadingHex" value="#1A1816" onchange="syncColorInput('customHeading', this.value)" class="w-16 bg-stone-800 border border-stone-700 rounded px-1 text-[11px] text-stone-200">
                            </div>
                        </div>
                        <div>
                            <span class="text-stone-400 block mb-1">Akcenti / Bedž</span>
                            <div class="flex items-center gap-2">
                                <input type="color" id="customAccent" value="#879A83" onchange="updateCustomColors()" class="w-8 h-8 rounded bg-transparent cursor-pointer">
                                <input type="text" id="customAccentHex" value="#879A83" onchange="syncColorInput('customAccent', this.value)" class="w-16 bg-stone-800 border border-stone-700 rounded px-1 text-[11px] text-stone-200">
                            </div>
                        </div>
                        <div>
                            <span class="text-stone-400 block mb-1">Okviri / Zlato</span>
                            <div class="flex items-center gap-2">
                                <input type="color" id="customGold" value="#D4AF37" onchange="updateCustomColors()" class="w-8 h-8 rounded bg-transparent cursor-pointer">
                                <input type="text" id="customGoldHex" value="#D4AF37" onchange="syncColorInput('customGold', this.value)" class="w-16 bg-stone-800 border border-stone-700 rounded px-1 text-[11px] text-stone-200">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Carousel Selector Tabs -->
            <div class="space-y-3">
                <div class="flex justify-between items-center">
                    <h2 class="text-md font-semibold text-gold-light">📚 Karuseli (Objave)</h2>
                    <span id="carouselCountBadge" class="text-xs bg-stone-800 px-2.5 py-1 rounded-full text-sage-green font-bold">1 od 1</span>
                </div>
                <div id="carouselTabsList" class="flex gap-2 overflow-x-auto pb-2 scrollbar-thin"></div>
            </div>

            <!-- Slide Editor Controls -->
            <div class="space-y-4 pt-2 border-t border-stone-800">
                <div class="flex justify-between items-center">
                    <h2 class="text-md font-semibold text-gold-light">✏️ Uređivanje Slajdova</h2>
                    <div class="flex gap-1.5">
                        <button onclick="addSlideToCurrent()" class="text-xs bg-sage-green/20 text-sage-green hover:bg-sage-green/30 px-3 py-1 rounded-lg font-medium border border-sage-green/40">+ Slajd</button>
                        <button onclick="removeCurrentSlide()" class="text-xs bg-red-500/20 text-red-400 hover:bg-red-500/30 px-3 py-1 rounded-lg font-medium border border-red-500/40">Obriši</button>
                    </div>
                </div>

                <!-- Slide Navigation Dots -->
                <div id="slideTabsList" class="flex flex-wrap gap-2"></div>

                <!-- Active Slide Form -->
                <div class="bg-stone-900 p-4 rounded-xl border border-stone-800 space-y-3" id="activeSlideForm">
                    <div>
                        <label class="text-xs text-stone-400 block mb-1">Badge / Oznaka gornja</label>
                        <input type="text" id="inputBadge" oninput="updateActiveSlideData()" class="w-full bg-stone-950 border border-
